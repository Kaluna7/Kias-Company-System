# OnlyOffice container -> this nginx -> Next.js :3000 OR static report files
server {
    listen 8888;
    server_name _;

    client_max_body_size 100m;

    # DOCX files written by KIAS (data/reports/*.docx) — no auth, for OnlyOffice fetch
    location /reports/ {
        alias /var/kias-reports/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-store";
        default_type application/vnd.openxmlformats-officedocument.wordprocessingml.document;
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Kias-Document-Token $http_x_kias_document_token;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
