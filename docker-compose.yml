services:
  app:
    build:
      context: .
      args:
        SOP_EXTRACT_MODE: vision
        NEXT_PUBLIC_SOP_EXTRACT_MODE: vision

    container_name: kias-app
    restart: always

    ports:
      - "3001:3000"

    environment:
      DATABASE_URL: postgresql://postgres:12345@postgres_db:5432/kias
      NEXTAUTH_SECRET: supersecret_kias_2026
      NEXTAUTH_URL: http://76.13.20.134:3001
      NODE_OPTIONS: --max-old-space-size=4096

      OPENAI_API_KEY: ${OPENAI_API_KEY}

      HOSTNAME: "0.0.0.0"
      PORT: "3000"

      INTERNAL_APP_URL: http://127.0.0.1:3000

      SOP_EXTRACT_MODE: vision
      NEXT_PUBLIC_SOP_EXTRACT_MODE: vision

      # ✅ MINIO CONFIG
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: evidence

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    container_name: minio_storage
    restart: always

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

networks:
  default:
    external: true
    name: kias-company-system_default

volumes:
  minio_data: