# Fixed Compose project — Jenkins workspace folder must not change volume/container grouping.
name: kias

services:
  app:
    build:
      context: .
      args:
        SOP_EXTRACT_MODE: vision
        NEXT_PUBLIC_SOP_EXTRACT_MODE: vision
        # Bundled into client — must match browser URL to OnlyOffice (port 8082)
        NEXT_PUBLIC_ONLYOFFICE_URL: ${NEXT_PUBLIC_ONLYOFFICE_URL:-http://76.13.20.134:8082}

    container_name: kias-app
    restart: always

    ports:
      - "3001:3000"

    environment:
      DATABASE_URL: postgresql://postgres:12345@postgres_db:5432/kias
      NEXTAUTH_SECRET: supersecret_kias_2026
      NEXTAUTH_URL: http://76.13.20.134:3001
      NODE_OPTIONS: --max-old-space-size=4096

      OPENAI_API_KEY: ${OPENAI_API_KEY}

      HOSTNAME: "0.0.0.0"
      PORT: "3000"

      INTERNAL_APP_URL: http://127.0.0.1:3000

      SOP_EXTRACT_MODE: vision
      NEXT_PUBLIC_SOP_EXTRACT_MODE: vision

      # MinIO — app talks to minio:9000; browser uses MINIO_PUBLIC_URL (must match UFW :9000)
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://76.13.20.134:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: evidence
      MINIO_REGION: us-east-1

      # OnlyOffice Document Server — report editor, co-edit, PDF export
      # Browser → NEXT_PUBLIC_ONLYOFFICE_URL (8082) | app → ONLYOFFICE_URL (internal)
      ONLYOFFICE_URL: http://onlyoffice
      NEXT_PUBLIC_ONLYOFFICE_URL: ${NEXT_PUBLIC_ONLYOFFICE_URL:-http://76.13.20.134:8082}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-kias_onlyoffice_jwt_change_me}
      ONLYOFFICE_JWT_ENABLED: "true"
      REPORT_DOCUMENT_HOST_URL: http://app:3000
      REPORT_DOCUMENT_STATIC_FILES: "false"

    volumes:
      # Legacy local evidence/worksheet files (before MinIO); keep until all files migrated
      - /var/www/kias-uploads:/app/public/uploads
      - kias_report_docs:/app/data/reports
      # Dashboard Files module: binary + folders live in PostgreSQL (file_uploads / file_folders).
      # Do NOT add a bind mount or named volume for /app/data/files — redeploy would show an empty dir
      # and risks wiping imported folder metadata on the host.

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    depends_on:
      minio:
        condition: service_started
      onlyoffice:
        condition: service_healthy

  # OnlyOffice Document Server — required for consolidated report editor
  # Health: http://<host>:8082/healthcheck | Editor loads api.js from :8082
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: kias-onlyoffice
    restart: always
    ports:
      - "8082:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-kias_onlyoffice_jwt_change_me}
      # Fetch DOCX + save callback from app container (http://app:3000)
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s

  minio:
    image: minio/minio:latest
    container_name: minio_storage
    restart: always

    ports:
      - "9000:9000"
      # Console: do not expose publicly; use SSH tunnel: ssh -L 9001:localhost:9001 root@VPS
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

networks:
  default:
    external: true
    name: kias-company-system_default

volumes:
  minio_data:
    name: kias_minio_data
  kias_report_docs:
    name: kias_report_docs
  onlyoffice_data:
    name: kias_onlyoffice_data
  onlyoffice_logs:
    name: kias_onlyoffice_logs
