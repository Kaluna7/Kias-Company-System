# OnlyOffice + nginx proxy to Next.js on host (local dev).
# Start:  pnpm onlyoffice:up
# DOCX URL for OnlyOffice: http://kias-doc-proxy:8888/api/report/documents/...

services:
  kias-doc-proxy:
    image: nginx:alpine
    container_name: kias-doc-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./infra/nginx-doc-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/reports:/var/kias-reports:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - onlyoffice_net

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: kias-onlyoffice-local
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      # Local dev: JWT off avoids blank editor + token/outbox issues (OnlyOffice 9.x)
      JWT_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kias-doc-proxy
    networks:
      - onlyoffice_net

networks:
  onlyoffice_net:
    driver: bridge
